name: Build

on:
  push:
    branches: [main, feat/wechat-pay]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: nuget/setup-nuget@v2

      - name: Restore NuGet packages
        run: nuget restore BNet.Cafe.sln

      # The Server references the WebSocket's built exe
      # (..\BNet.Cafe.Websocket\bin\Debug\BNet.Cafe.Websocket.exe),
      # so the WebSocket project must build first.
      # NOTE: the .csproj uses Platform "AnyCPU" (no space); the .sln uses "Any CPU".
      - name: Build WebSocket (Debug)
        run: msbuild BNet.Cafe.Websocket/BNet.Cafe.Websocket.csproj /p:Configuration=Debug /p:Platform="AnyCPU" /verbosity:minimal

      - name: Build solution (Debug)
        run: msbuild BNet.Cafe.sln /p:Configuration=Debug /p:Platform="Any CPU" /verbosity:minimal

      # Assemble a complete deployable Server web app: all web files
      # (.aspx/.ashx/.js/.css/Web.config, plus the built bin/) minus source
      # code (*.cs, *.csproj) and the obj/ build folder. The previous
      # artifact was bin/ only, which is not deployable on its own.
      - name: Package Server web app
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path server-package | Out-Null
          $serverRoot = (Resolve-Path BNet.Cafe.Server).Path
          Get-ChildItem -Path BNet.Cafe.Server -Recurse -File | Where-Object {
            $_.FullName -notmatch '\\obj\\' -and
            $_.Extension -notin '.cs', '.csproj', '.user', '.sln'
          } | ForEach-Object {
            $rel = $_.FullName.Substring($serverRoot.Length + 1)
            $dest = Join-Path server-package $rel
            New-Item -ItemType Directory -Force -Path (Split-Path $dest) | Out-Null
            Copy-Item $_.FullName $dest -Force
          }
          Get-ChildItem server-package -Recurse -File |
            Select-Object -First 5 FullName | ForEach-Object { Write-Host $_.FullName }

      - name: Upload Client
        uses: actions/upload-artifact@v4
        with:
          name: BNet.Cafe.Client-Debug
          path: BNet.Cafe.Client/bin/Debug/
          if-no-files-found: error

      - name: Upload Server
        uses: actions/upload-artifact@v4
        with:
          name: BNet.Cafe.Server-Debug
          path: server-package/
          if-no-files-found: error

      - name: Upload WebSocket
        uses: actions/upload-artifact@v4
        with:
          name: BNet.Cafe.Websocket-Debug
          path: BNet.Cafe.Websocket/bin/Debug/
          if-no-files-found: error

  # One-click installer for cafe owners (Inno Setup):
  # IIS via DISM + bundled MariaDB MSI + Server/Client/WebSocket.
  # The owner just double-clicks the .exe; no XAMPP, no manual IIS setup.
  installer:
    needs: build
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Server package
        uses: actions/download-artifact@v4
        with:
          name: BNet.Cafe.Server-Debug
          path: server-package

      - name: Download Client
        uses: actions/download-artifact@v4
        with:
          name: BNet.Cafe.Client-Debug
          path: BNet.Cafe.Client/bin/Debug

      - name: Download WebSocket
        uses: actions/download-artifact@v4
        with:
          name: BNet.Cafe.Websocket-Debug
          path: BNet.Cafe.Websocket/bin/Debug

      # downloads.mariadb.com 522s from some networks; the archive mirror is stable.
      - name: Download MariaDB MSI
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path installer/redist | Out-Null
          Invoke-WebRequest -Uri "https://archive.mariadb.org/mariadb-11.4.5/winx64-packages/mariadb-11.4.5-winx64.msi" -OutFile "installer/redist/mariadb-11.4.5-winx64.msi"
          $f = Get-Item "installer/redist/mariadb-11.4.5-winx64.msi"
          Write-Host "MariaDB MSI: $($f.Length) bytes"
          if ($f.Length -lt 50000000) { throw "MariaDB MSI suspiciously small, download may have failed." }

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Compile installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer/BNetCafe.iss
          Get-ChildItem installer-output -Recurse | Select-Object FullName, Length

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: BNetCafe-Setup
          path: installer-output/BNetCafe-Setup-*.exe
          if-no-files-found: error
