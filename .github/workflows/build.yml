name: Build

on:
  push:
    branches: [main, feat/wechat-pay]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: nuget/setup-nuget@v2

      - name: Restore NuGet packages
        run: nuget restore BNet.Cafe.sln

      # The Server references the WebSocket's built exe
      # (..\BNet.Cafe.Websocket\bin\Debug\BNet.Cafe.Websocket.exe),
      # so the WebSocket project must build first.
      # NOTE: the .csproj uses Platform "AnyCPU" (no space); the .sln uses "Any CPU".
      - name: Build WebSocket (Debug)
        run: msbuild BNet.Cafe.Websocket/BNet.Cafe.Websocket.csproj /p:Configuration=Debug /p:Platform="AnyCPU" /verbosity:minimal

      - name: Build solution (Debug)
        run: msbuild BNet.Cafe.sln /p:Configuration=Debug /p:Platform="Any CPU" /verbosity:minimal

      # Assemble a complete deployable Server web app: all web files
      # (.aspx/.ashx/.js/.css/Web.config, plus the built bin/) minus source
      # code (*.cs, *.csproj) and the obj/ build folder. The previous
      # artifact was bin/ only, which is not deployable on its own.
      - name: Package Server web app
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path server-package | Out-Null
          $serverRoot = (Resolve-Path BNet.Cafe.Server).Path
          Get-ChildItem -Path BNet.Cafe.Server -Recurse -File | Where-Object {
            $_.FullName -notmatch '\\obj\\' -and
            $_.Extension -notin '.cs', '.csproj', '.user', '.sln'
          } | ForEach-Object {
            $rel = $_.FullName.Substring($serverRoot.Length + 1)
            $dest = Join-Path server-package $rel
            New-Item -ItemType Directory -Force -Path (Split-Path $dest) | Out-Null
            Copy-Item $_.FullName $dest -Force
          }
          Get-ChildItem server-package -Recurse -File |
            Select-Object -First 5 FullName | ForEach-Object { Write-Host $_.FullName }

      - name: Upload Client
        uses: actions/upload-artifact@v4
        with:
          name: BNet.Cafe.Client-Debug
          path: BNet.Cafe.Client/bin/Debug/
          if-no-files-found: error

      - name: Upload Server
        uses: actions/upload-artifact@v4
        with:
          name: BNet.Cafe.Server-Debug
          path: server-package/
          if-no-files-found: error

      - name: Upload WebSocket
        uses: actions/upload-artifact@v4
        with:
          name: BNet.Cafe.Websocket-Debug
          path: BNet.Cafe.Websocket/bin/Debug/
          if-no-files-found: error
